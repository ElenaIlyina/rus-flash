<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Статистика — Банк заданий ЕГЭ</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; color: #333; }
        .wrap { max-width: 720px; margin: 0 auto; }
        h1 { font-size: 22px; color: #2c3e50; margin: 0 0 4px 0; }
        .sub { color: #777; font-size: 13px; margin-bottom: 20px; }

        .overall { background: #fff; border: 1px solid #e1e4e8; border-radius: 8px; padding: 20px; margin-bottom: 20px; text-align: center; }
        .overall .big { font-size: 44px; font-weight: bold; color: #2c3e50; }
        .overall .big small { font-size: 18px; color: #999; font-weight: normal; }
        .overall .label { color: #666; margin-top: 4px; }
        .overall .track { background: #eee; border-radius: 20px; height: 14px; margin: 14px 0 10px; overflow: hidden; }
        .overall .fill { height: 100%; background: linear-gradient(90deg,#66bb6a,#43a047); border-radius: 20px; transition: width 0.4s; }
        .overall .remaining { font-size: 14px; } 

        .section { background: #fff; border: 1px solid #e1e4e8; border-radius: 8px; padding: 16px 20px; margin-bottom: 14px; }
        .section h2 { font-size: 15px; margin: 0 0 2px 0; color: #2c3e50; }
        .section .code { font-size: 12px; color: #999; margin-bottom: 10px; }
        .section .track { background: #eee; border-radius: 8px; height: 12px; overflow: hidden; margin-bottom: 8px; }
        .section .fill { height: 100%; background: #4caf50; border-radius: 8px; transition: width 0.4s; }
        .section .count { font-size: 12px; color: #777; margin-bottom: 8px; }
        .chips { display: flex; flex-wrap: wrap; gap: 6px; }
        .chip { padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; border: 1px solid #ccc; background: #fafafa; color: #888; }
        .chip.done { background: #e8f5e9; border-color: #4caf50; color: #2e7d32; }
        .chip.todo { background: #fff; border-color: #ccc; color: #888; }

        .empty { text-align: center; color: #888; padding: 40px; }
        .toggle-btn { position: fixed; top: 16px; right: 16px; background: #2c3e50; color: #fff; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; }

        .donut-wrap { background: #fff; border: 1px solid #e1e4e8; border-radius: 8px; padding: 20px; margin-bottom: 20px; display: flex; gap: 24px; align-items: center; flex-wrap: wrap; }
        .donut-wrap h3 { margin: 0 0 12px 0; font-size: 14px; color: #2c3e50; width: 100%; }
        .donut-box { position: relative; width: 180px; height: 180px; flex-shrink: 0; }
        .donut-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .donut-center .pct { font-size: 30px; font-weight: bold; color: #2c3e50; }
        .donut-center .pct small { font-size: 14px; color: #999; }
        .donut-center .cap { font-size: 11px; color: #888; }
        .donut-legend { flex: 1; min-width: 200px; }
        .donut-legend .row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #555; margin-bottom: 6px; }
        .donut-legend .swatch { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }
        .donut-legend .row .num { margin-left: auto; font-weight: bold; color: #333; }
    </style>
</head>
<body>
    <button class="toggle-btn" id="viewBtn" onclick="toggleView()">Список</button>
    <div class="wrap">
        <h1>Статистика по разделам</h1>
        <div class="sub">Прогресс по банку заданий ЕГЭ (ФИПИ)</div>

        <div class="overall">
            <div id="overallBig" class="big">0<small>/0</small></div>
            <div class="label" id="overallLabel">решено заданий</div>
            <div class="track"><div id="overallFill" class="fill" style="width:0%"></div></div>
            <div class="remaining" id="overallRemaining">Осталось: 0</div>
        </div>

        <div class="donut-wrap">
            <h3>Прогресс по темам</h3>
            <div class="donut-box">
                <svg id="donutSvg" width="180" height="180" viewBox="0 0 180 180"></svg>
                <div class="donut-center">
                    <div class="pct" id="donutPct">0<small>%</small></div>
                    <div class="cap">решено</div>
                </div>
            </div>
            <div class="donut-legend" id="donutLegend"></div>
        </div>

        <div id="sections"></div>
        <div id="emptyMsg" class="empty" style="display:none;">Нет данных о заданиях</div>
    </div>

    <script>
        var TASKS = [
            {num:'41634D', kes:'3.8.4', title:'Однородные члены'},
            {num:'428BFF', kes:'3.2.3', title:'Орфоэпические нормы'},
            {num:'4E5B4C', kes:'3.8.6', title:'Вводные конструкции'},
            {num:'8AA04D', kes:'3.8.6', title:'Вводные конструкции'},
            {num:'8C2046', kes:'3.6.3', title:'Грамматические нормы (синтаксис)'},
            {num:'8E184E', kes:'3.8.8', title:'Сложные предложения с разными видами связи'},
            {num:'8F0049', kes:'3.7.6', title:'Правописание Н/НН'},
            {num:'8F9A42', kes:'3.8.8', title:'Сложные предложения с разными видами связи'},
            {num:'F2B1F1', kes:'3.8.5', title:'Обособление'},
            {num:'FA72F2', kes:'3.7.7', title:'Правописание НЕ/НИ'}
        ];
        var showCards = true;
        var parentTags = null;

        function getData(num) {
            if (parentTags) return (parentTags[num] || {});
            try { return JSON.parse(localStorage.getItem('task_tags_' + num) || '{}'); }
            catch(e) { return {}; }
        }

        function toggleView() {
            showCards = !showCards;
            document.getElementById('viewBtn').innerText = showCards ? 'Список' : 'Диаграммы';
            render();
        }

        var DONUT_COLORS = ['#1976d2','#7b1fa2','#00897b','#e64a19','#5d4037','#c62828','#2e7d32','#f9a825','#4527a0','#00695c'];

        function polar(cx, cy, r, angleDeg) {
            var rad = (angleDeg - 90) * Math.PI / 180;
            return [cx + r * Math.cos(rad), cy + r * Math.sin(rad)];
        }

        function arcPath(cx, cy, r, start, end) {
            var s = polar(cx, cy, r, end);
            var e = polar(cx, cy, r, start);
            var large = (end - start) > 180 ? 1 : 0;
            return 'M' + s[0] + ',' + s[1] + ' A' + r + ',' + r + ' 0 ' + large + ' 0 ' + e[0] + ',' + e[1];
        }

        function renderDonut(byKes, total, done) {
            var svg = document.getElementById('donutSvg');
            var legend = document.getElementById('donutLegend');
            if (!svg) return;

            var cx = 90, cy = 90, rOuter = 78, rInner = 50;

            var html = '';
            document.getElementById('donutPct').innerHTML = (total ? Math.round(done/total*100) : 0) + '<small>%</small>';

            var keys = Object.keys(byKes).sort(function(a,b){ return a.localeCompare(b); });
            var totalW = keys.length;
            var angle = 0;
            var seg = 360 / Math.max(totalW, 1);

            var legendHtml = '';
            keys.forEach(function(k, i) {
                var s = byKes[k];
                var color = DONUT_COLORS[i % DONUT_COLORS.length];
                var pct = s.total ? Math.round(s.done / s.total * 100) : 0;

                // background (full segment) - light gray, thin
                var bgArc = arcPath(cx, cy, rOuter, angle, angle + seg);
                var bgPath = '<path d="' + bgArc +
                    ' L' + polar(cx, cy, rInner, angle + seg)[0] + ',' + polar(cx, cy, rInner, angle + seg)[1] +
                    ' A' + rInner + ',' + rInner + ' 0 0 0 ' + polar(cx, cy, rInner, angle)[0] + ',' + polar(cx, cy, rInner, angle)[1] +
                    ' Z" fill="#e0e0e0" opacity="0.55"/>';

                html += bgPath;

                // progress (solved) portion of this segment
                if (pct > 0) {
                    var endAngle = angle + seg * (s.done / s.total);
                    var prArc = arcPath(cx, cy, rOuter, angle, endAngle);
                    var prPath = '<path d="' + prArc +
                        ' L' + polar(cx, cy, rInner, endAngle)[0] + ',' + polar(cx, cy, rInner, endAngle)[1] +
                        ' A' + rInner + ',' + rInner + ' 0 0 0 ' + polar(cx, cy, rInner, angle)[0] + ',' + polar(cx, cy, rInner, angle)[1] +
                        ' Z" fill="' + color + '"/>';
                    html += prPath;
                }

                legendHtml += '<div class="row"><span class="swatch" style="background:' + color + '"></span>' +
                    '<span>' + s.title + '</span><span class="num">' + s.done + '/' + s.total + '</span></div>';

                angle += seg;
            });

            svg.innerHTML = html;
            legend.innerHTML = legendHtml;
        }


        function render() {
            var byKes = {};
            var total = 0, done = 0;
            TASKS.forEach(function(t) {
                var solved = !!getData(t.num).solved;
                total++; if (solved) done++;
                if (!byKes[t.kes]) byKes[t.kes] = {title:t.title, tasks:[], total:0, done:0};
                byKes[t.kes].tasks.push({num:t.num, solved:solved});
                byKes[t.kes].total++;
                if (solved) byKes[t.kes].done++;
            });

            document.getElementById('overallBig').innerHTML = done + '<small>/' + total + '</small>';
            document.getElementById('overallLabel').innerHTML = 'решено заданий';
            document.getElementById('overallFill').style.width = (total ? Math.round(done/total*100) : 0) + '%';
            document.getElementById('overallRemaining').innerHTML = 'Осталось: <b>' + (total - done) + '</b> из ' + total;
            renderDonut(byKes, total, done);

            var keys = Object.keys(byKes).sort(function(a,b){ return a.localeCompare(b); });
            var html = '';
            keys.forEach(function(k) {
                var s = byKes[k];
                var pct = Math.round(s.done/s.total*100);
                if (showCards) {
                    html += '<div class="section"><h2>' + s.title + '</h2><div class="code">КЭС ' + k + '</div>' +
                        '<div class="count">' + s.done + ' из ' + s.total + ' решено</div>' +
                        '<div class="track"><div class="fill" style="width:' + pct + '%"></div></div>' +
                        '<div class="chips">';
                    s.tasks.forEach(function(t) {
                        html += '<span class="chip ' + (t.solved ? 'done' : 'todo') + '">№ ' + t.num + (t.solved ? ' ✓' : '') + '</span>';
                    });
                    html += '</div></div>';
                } else {
                    html += '<div class="section"><h2>' + s.title + '</h2><div class="code">КЭС ' + k + '</div>' +
                        '<div class="count">' + s.done + ' / ' + s.total + '</div>' +
                        '<div class="track"><div class="fill" style="width:' + pct + '%"></div></div>' +
                        '</div>';
                }
            });
            document.getElementById('sections').innerHTML = html;
            document.getElementById('emptyMsg').style.display = TASKS.length ? 'none' : 'block';
        }

        var source = null;
        if (window.parent !== window.self) {
            source = window.parent;
        }

        function requestAll() {
            if (source) source.postMessage({type: 'request_all_tags'}, '*');
        }

        window.addEventListener('message', function(e) {
            var d = e.data;
            if (d && d.type === 'all_tags') {
                parentTags = d.tags || {};
                render();
            } else if (d && d.type === 'tags_data' && d.num) {
                if (parentTags) parentTags[d.num] = d.data;
                try { localStorage.setItem('task_tags_' + d.num, JSON.stringify(d.data)); } catch(e) {}
                render();
            }
        });

        document.addEventListener('DOMContentLoaded', function() {
            render();
            if (source) requestAll();
        });
        setInterval(function() {
            if (source) requestAll();
            render();
        }, 1000);
    </script>
</body>
</html>
